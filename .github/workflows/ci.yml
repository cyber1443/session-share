name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repo. Anything that needs more asks for it per job.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to other
# code, and verify-bundle is only as trustworthy as the steps that build it.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No version here on purpose: `packageManager` in package.json is the
      # single source of truth, and declaring both makes the action refuse.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  # The plugin ships as committed build output, so anyone installing it runs
  # prebuilt JavaScript. This rebuilds it from source and checks the result
  # against what is committed -- which is what turns "trust the bundle" into
  # something a stranger can verify. See scripts/verify-bundle.mjs for what is
  # guaranteed byte-for-byte and what is not.
  verify-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No version here on purpose: `packageManager` in package.json is the
      # single source of truth, and declaring both makes the action refuse.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle
      - name: The committed bundle must match a fresh build
        run: node scripts/verify-bundle.mjs

  # What Claude Code reads at install time: the manifests, hooks, commands and
  # skills. A broken one installs fine and fails on the user's machine, so it is
  # caught here instead.
  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # check-version compares against origin/main, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate packages/plugin
      - run: claude plugin validate .claude-plugin/marketplace.json
      # The pre-push hook runs this too, but `git push --no-verify` skips it.
      - name: A changed plugin must come with a version bump
        run: node scripts/check-version.mjs
